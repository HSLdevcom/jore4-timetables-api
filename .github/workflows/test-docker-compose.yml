name: Test whether the dockerized version works

on:
  push:
  pull_request:
    branches: [main, releases/**]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-docker-compose:
    name: verify docker-compose setup
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'jore4-hasura/test/hasura/package.json'
          cache: 'yarn'
          cache-dependency-path: 'jore4-hasura/test/hasura/yarn.lock'

      - name: Start development dependencies and the timetables service
        run: ./development.sh start

      - name: Verify that dockerized timetables API is up and running
        uses: HSLdevcom/jore4-tools/github-actions/healthcheck@main
        with:
          command:
            "curl --fail http://localhost:3009/actuator/health --output
            /dev/null --silent"
